services:

  db:
    image: postgres:15-alpine
    container_name: pagneshop_db
    restart: always
    environment:
      POSTGRES_DB: pagne_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: azerty@
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pagneshop_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .          # ✅ dossier courant
      dockerfile: Dockerfile   # ✅ chemin explicite
    container_name: pagneshop_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - pagneshop_net

  frontend:
    build:
      context: ./pagne-frontend
      dockerfile: Dockerfile   # ✅ chemin explicite
    container_name: pagneshop_frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - pagneshop_net

volumes:
  pgdata:

networks:
  pagneshop_net:
    driver: bridge