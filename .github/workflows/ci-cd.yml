# .github/workflows/ci-cd.yml
name: CI/CD PagneShop

# Se déclenche à chaque push sur main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Tests Backend Laravel ──
  test-backend:
    name: 🧪 Tests Laravel
    runs-on: ubuntu-latest

    services:
      # Base de données PostgreSQL pour les tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pagne_shop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Récupère le code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Installe PHP 8.2
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, gd
          coverage: none

      # 3. Cache les dépendances Composer
      - name: 📦 Cache Composer
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      # 4. Installe les dépendances
      - name: 📦 Install dependencies
        run: composer install --no-dev --optimize-autoloader

      # 5. Configure l'environnement de test
      - name: ⚙️ Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pagne_shop_test
          DB_USERNAME: postgres
          DB_PASSWORD: password

      # 6. Lance les migrations
      - name: 🗄️ Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pagne_shop_test
          DB_USERNAME: postgres
          DB_PASSWORD: password

      # 7. Lance les tests
      - name: 🧪 Run tests
        run: ./vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pagne_shop_test
          DB_USERNAME: postgres
          DB_PASSWORD: password

  # ── Job 2 : Build Frontend React ──
  build-frontend:
    name: ⚛️ Build React
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pagne-frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: pagne-frontend
        run: npm install

      - name: 🏗️ Build
        working-directory: pagne-frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

  # ── Job 3 : Deploy sur Railway ──
  deploy:
    name: 🚀 Deploy Railway
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend] # attend que les 2 jobs passent
    if: github.ref == 'refs/heads/main'   # seulement sur main

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_ID }}