name: CI/CD PagneShop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Tests Backend Laravel ──
  test-backend:
    name: 🧪 Tests Laravel
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pagne_shop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, gd
          tools: composer:v2
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: ⚙️ Setup .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🗄️ Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pagne_shop_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
          APP_KEY: ${{ env.APP_KEY }}

      - name: 🧪 Run PHPUnit tests
        run: vendor/bin/phpunit --testdox
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pagne_shop_test
          DB_USERNAME: postgres
          DB_PASSWORD: password

  # ── Job 2 : Build Frontend React ──
  build-frontend:
    name: ⚛️ Build React
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pagne-frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: pagne-frontend
        run: npm install

      - name: 🏗️ Build React
        working-directory: pagne-frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}